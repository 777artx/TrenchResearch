name: daily

# Daily data collection. Free on GitHub's included Actions minutes; with the
# account's spending limit at $0, GitHub stops jobs rather than charging.
# Needs no secrets: every daily source is a free public API.

on:
  schedule:
    - cron: "23 5 * * *"   # 05:23 UTC, after TEHscreener's daily sync (~04:10 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out data branch into ./data
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install headless browser for the GMGN collector
        working-directory: tools/gmgn
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run daily job
        env:
          TRENCH_DATA_DIR: data
        run: uv run trench daily

      - name: Save collected data to the data branch
        if: always()
        working-directory: data
        run: |
          git config user.name "trench-bot"
          git config user.email "trench-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -q -m "data: daily run $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git push -q origin data && break || sleep $((i * 10)); done
          fi
