[project]
name = "trench"
version = "0.1.0"
description = "Onchain research for memecoin and microcap traders: ingestion, point-in-time storage, indicators."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-bigquery-storage>=2.43.0",
    "httpx>=0.28.1",
    "pyarrow>=26.0.1",
    "pytz>=2026.6",
    "solders>=0.29.0",
    "typer>=0.29.1",
]

[project.scripts]
trench = "trench.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/trench/cli.py" = ["B008"]  # typer declares options as defaults
